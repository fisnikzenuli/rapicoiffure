<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Rapi Coiffure — Admin</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin { padding: calc(2rem + env(safe-area-inset-top, 0px)) 0 4rem; }
        .admin__top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .admin__top img { height: 52px; width: auto; }
        .admin__demo { max-width: none; margin-bottom: 1.5rem; }
        .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
        .filters .chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
        .day-group { margin-bottom: 2rem; }
        .day-group h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; letter-spacing: .05em; color: var(--bone); border-bottom: 1px solid var(--line); padding-bottom: .4rem; margin-bottom: .8rem; }
        .req { display: grid; grid-template-columns: 90px 1fr auto; gap: 1rem; align-items: start; padding: 1rem; border: 1px solid var(--line); border-radius: 6px; background: var(--char-deep); margin-bottom: .6rem; }
        .req__time { font-family: var(--font-display); font-size: 1.8rem; line-height: 1; color: var(--gold); }
        .req__time small { display: block; font-family: var(--font-text); font-size: .9rem; font-style: italic; color: var(--muted); margin-top: .3rem; }
        .req__who strong { color: var(--bone); font-size: 1.15rem; }
        .req__who p { margin: .1rem 0; color: var(--muted); font-size: 1rem; }
        .req__actions { display: flex; flex-direction: column; gap: .4rem; align-items: stretch; min-width: 190px; }
        .req__actions .btn { min-height: 42px; font-size: 1rem; padding: .6em 1em .5em; }
        .req.is-cancelled { opacity: .5; }
        .badge--confirmed { color: #9fd3a4; border-color: rgba(159, 211, 164, .5); }
        .badge--confirmed::before { background: #9fd3a4; }
        .badge--cancelled { color: var(--muted); border-color: var(--line); }
        .badge--cancelled::before { background: var(--muted); }
        .req__badges { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
        .confirm-panel { display: flex; flex-direction: column; gap: .45rem; }
        .confirm-panel label { font-weight: 600; color: var(--bone); font-size: 1rem; line-height: 1.2; }
        .confirm-panel input { min-height: 48px; padding: .5rem .8rem; border: 1px solid #5a5a5a; border-radius: var(--radius); background: var(--char); color: var(--bone); font: 500 1.25rem var(--font-text); }
        .confirm-panel input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(219, 194, 125, .18); }
        .confirm-panel small { color: var(--muted); font-style: italic; font-size: .9rem; line-height: 1.3; }
        @media (max-width: 700px) { .confirm-panel { flex: 1 1 100%; } }
        .empty { padding: 2rem; border: 1px dashed var(--line-strong); border-radius: 6px; text-align: center; font-style: italic; max-width: none; }
        @media (max-width: 700px) {
            .req { grid-template-columns: 70px 1fr; }
            .req__actions { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; min-width: 0; }
            .req__actions .btn { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c.3 2.2 2.3 4.2 4.5 4.5l1-1.2 1.8.8-.3 1.6c-3.8.3-7.5-3.4-7.2-7.2l1.6-.3.8 1.8z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<main class="admin">
    <div class="container">
        <div class="admin__top">
            <img src="assets/img/logo-wordmark.png" alt="Rapi Coiffure">
            <div class="lang" role="group">
                <button type="button" class="lang__btn" data-lang="fr">FR</button>
                <button type="button" class="lang__btn" data-lang="en">EN</button>
            </div>
        </div>
        <h1 class="title" data-t="title"></h1>
        <p class="notice admin__demo" id="demoNotice" data-t="demo"></p>
        <!-- Login (only used when the Supabase database is connected) -->
        <form class="form" id="login" hidden style="max-width:560px;margin-bottom:2rem">
            <div class="field"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required></div>
            <div class="field"><label for="lPass" data-t="password"></label><input id="lPass" type="password" autocomplete="current-password" required></div>
            <p class="field__error" id="loginError" style="grid-column:1/-1"></p>
            <div class="step__nav"><button type="submit" class="btn btn--gold" data-t="login"></button></div>
        </form>
        <div class="filters" id="filters"></div>
        <div id="list"></div>
    </div>
</main>

<!-- Database library (used automatically once js/storage.js has your Supabase URL + key) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/storage.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
